services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: doesnotsend
      POSTGRES_USER: app
      # Ao trocar a senha, atualize também DATABASE_URL no serviço app.
      POSTGRES_PASSWORD: doesnotsend_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doesnotsend"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Edite o IP e a porta do host neste mapeamento. A porta interna é 3000.
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      # Para QR Codes na LAN, use o IP do host e a porta publicada.
      - PUBLIC_BASE_URL=http://127.0.0.1:3000
      # Reserva espaço no tmpfs para o arquivo original e a edição.
      - MAX_FILE_SIZE=1006632960
      - MAX_STORAGE_BYTES=2013265920
      - DATABASE_URL=postgres://app:doesnotsend_dev_password@postgres:5432/doesnotsend
      # Painel /admin (edite ADMIN_PASSWORD aqui para trocar a senha)
      - ADMIN_PASSWORD=admin
    # Armazenamento em RAM volátil (tmpfs) dedicado para arquivos temporários
    tmpfs:
      - /tmp/uploads:rw,noexec,nosuid,size=2G,uid=1001,gid=1001,mode=0700
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:

networks:
  internal:
