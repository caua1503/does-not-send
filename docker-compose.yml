services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doesnotsend
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doesnotsend"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Porta vinculada à interface ou IP LAN desejado (padrão 0.0.0.0 ou IP específico)
    ports:
      - "${LAN_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      - TEMP_DIR=/tmp/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5368709120}
      - MAX_FILES_PER_SESSION=${MAX_FILES_PER_SESSION:-50}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-1800000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      # Heartbeat / reconexão (opcionais — defaults já sensatos)
      - HEARTBEAT_TIMEOUT_MS=${HEARTBEAT_TIMEOUT_MS:-25000}
      - COMPUTER_GRACE_MS=${COMPUTER_GRACE_MS:-30000}
      - PHONE_GRACE_MS=${PHONE_GRACE_MS:-30000}
      - WS_AUTH_TIMEOUT_MS=${WS_AUTH_TIMEOUT_MS:-5000}
      # Database
      - DATABASE_URL=${DATABASE_URL}
    # Armazenamento em RAM volátil (tmpfs) dedicado para arquivos temporários
    tmpfs:
      - /tmp/uploads:rw,noexec,nosuid,size=2G,uid=1001,gid=1001,mode=0700
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:

networks:
  internal:
